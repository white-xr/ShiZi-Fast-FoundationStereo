input_mode: image
locator:
  enabled: true
runtime:
  # Flask inference can run outside the main thread; eager mode avoids a
  # PyTorch 2.6 Dynamo CUDA device-cache failure on this machine.
  disable_torch_compile: true

model_dir: weights/23-36-37/model_best_bp2_serialize.pth
stereo_calibration_file: configs/stereo_calib.yaml
valid_iters: 12
max_disp: 128
build_volume_backend: pytorch1
low_memory: 1
scale: 1
hiera: 0
remove_invisible: 1
show: 0
save_inputs: 0
save_disp: 0
save_disp_vis: 0
save_depth: 0
save_report: 0
get_pc: 0
zfar: 0.8

segmentation:
  enabled: true
  input_coordinate: raw_left
  model_path: weights/triangle-metal.pt
  imgsz: 960
  conf_thres: 0.35
  device: cpu
  min_area_px: 500
  min_area_ratio: 0.001
  max_area_ratio: 0.7
  min_bbox_aspect: 0.2
  max_bbox_aspect: 5.0
  ambiguity_conf_delta: 0.05
  ambiguity_min_area_ratio: 0.5
  morph_open_kernel: 3
  morph_close_kernel: 3
  debug_vis: true
  draw_masks: true

rectification:
  # Offline visualization uses the captured pixels directly for YOLO and FFS.
  enabled: false
  alpha: 0.0
rectification_quality:
  enabled: false
  max_features: 1600
  min_matches: 20
  ratio_test: 0.75
  max_median_px: 0.5
  max_p95_px: 1.5
synchronization:
  # 离线左右图片按同名文件配对，不要求数据集额外提供 timestamps.csv。
  require_timestamps: false
  max_delta_ms: 2.0
  max_frame_index_delta: 0
roi:
  context_padding_px: 32
  padding_px: 8
  min_size_px: 160
plane:
  erode_px: 4
  erode_relative: 0.01
  min_disp: 0.5
  min_depth_m: 0.12
  max_depth_m: 0.8
  min_points: 300
  ransac_iterations: 400
  ransac_threshold_px: 0.8
  huber_delta: 1.5
  irls_iterations: 12
  grid_rows: 3
  grid_cols: 3
  min_cell_points: 12
  min_valid_ratio: 0.35
  min_inlier_ratio: 0.7
  min_spatial_coverage: 0.55
  max_rmse_px: 1.0
pose:
  # YOLO mask describes the metal plate's outer support silhouette, while A/B/C
  # are the physical inner landmarks used by the locator.  Rows map support
  # [A, B, C] to semantic A, B and C; calibrated from raw-left annotations.
  semantic_vertex_weights:
    - [0.74491902, 0.13361036, 0.12147062]
    - [0.08947715, 0.77073700, 0.13978585]
    - [0.10800542, 0.14184271, 0.75015187]
  min_contour_area_px: 500
  min_contour_iou: 0.45
  # 电批遮挡时，同一个 YOLO 实例会由左右两个可见区域组成。
  min_occluded_contour_iou: 0.35
  min_component_area_px: 32
  min_component_area_ratio: 0.08
  max_components: 4
  min_visible_fraction: 0.25
  min_mask_containment: 0.85
  max_fit_error_px: 6.0
  # 物理安装约束：A/B 是上方底边，C 必须是画面中向下的尖端。
  min_tip_height_ratio: 0.20
  max_tip_height_ratio: 1.60
  max_tip_side_ratio: 0.60
  min_tip_below_px: 1.0
  min_base_length_px: 12.0
  min_previous_normal_dot: 0.0
  temporal:
    enabled: true
    # TEMPORAL 每帧都从最后一个可靠 DIRECT 锚点跟踪到当前图，不冻结旧像素。
    # 45 帧约为 30 FPS 下 1.5 秒；超时后拒绝输出，避免长期沿用失效锚点。
    max_estimated_frames: 45
    max_frame_gap: 60
    max_interval_ms: 2000.0
    anchor_use_target_mask: false
    feature_padding_px: 28
    mask_feature_padding_px: 4
    max_features: 120
    feature_quality: 0.01
    feature_min_distance_px: 5.0
    feature_block_size: 7
    lk_window_px: 31
    lk_max_level: 4
    lk_iterations: 30
    lk_epsilon: 0.01
    max_fb_error_px: 1.5
    min_tracked_points: 8
    ransac_threshold_px: 2.0
    ransac_iterations: 500
    ransac_confidence: 0.99
    ransac_refine_iterations: 10
    min_inlier_points: 6
    min_inlier_ratio: 0.50
    min_scale: 0.65
    max_scale: 1.55
    max_rotation_deg: 35.0
    max_direct_prediction_error_ratio: 0.05
    min_direct_visible_fraction: 0.75
    min_direct_mask_area_ratio: 0.75
    min_candidate_visible_fraction: 0.25
    min_candidate_mask_containment: 0.70
    min_candidate_score: 0.15
    min_candidate_score_margin: 0.08
    max_vertex_outside_roi_px: 2.0
    confidence_scale: 0.60
visualization:
  axis_length_m: 0.03
screw:
  enabled: false
  offset_file: configs/screw_offset.yaml
debug:
  enabled: true
  save_inputs: false
  save_disp: false
  save_disp_vis: true
  save_depth: false
  save_point_cloud: false

safety:
  enabled: true
  action: error
  max_scale: 1.0
  max_valid_iters: 12
  max_max_disp: 128
  require_low_memory_when_vram_gb_lte: 6.5
  min_free_vram_gb: 1.0
  require_healthy_gpu: true

data_dir: workspace/data/A相机→白板268
out_dir: workspace/output/triangle_locator_offline
run_dir_format: "%m%d%H%M"
append_data_name_to_run_dir: true
overwrite: true
batch:
  pattern: "*.png"
