input_mode: image
locator:
  enabled: true

model_dir: weights/23-36-37/model_best_bp2_serialize.pth
stereo_calibration_file: configs/stereo_calib.yaml
valid_iters: 12
max_disp: 128
build_volume_backend: pytorch1
low_memory: 1
scale: 1
hiera: 0
remove_invisible: 1
show: 0
save_inputs: 0
save_disp: 0
save_disp_vis: 0
save_depth: 0
save_report: 0
get_pc: 0
zfar: 0.8

segmentation:
  enabled: true
  model_path: weights/triangle-metal.pt
  imgsz: 960
  conf_thres: 0.35
  device: cpu
  min_area_px: 500
  min_area_ratio: 0.001
  max_area_ratio: 0.7
  min_bbox_aspect: 0.2
  max_bbox_aspect: 5.0
  ambiguity_conf_delta: 0.05
  ambiguity_min_area_ratio: 0.5
  morph_open_kernel: 3
  morph_close_kernel: 3
  debug_vis: true
  draw_masks: true

rectification:
  alpha: 0.0
rectification_quality:
  enabled: true
  max_features: 1600
  min_matches: 20
  ratio_test: 0.75
  max_median_px: 0.5
  max_p95_px: 1.5
synchronization:
  max_delta_ms: 2.0
  max_frame_index_delta: 0
roi:
  context_padding_px: 32
  padding_px: 8
  min_size_px: 160
plane:
  erode_px: 4
  erode_relative: 0.01
  min_disp: 0.5
  min_depth_m: 0.12
  max_depth_m: 0.8
  min_points: 300
  ransac_iterations: 400
  ransac_threshold_px: 0.8
  huber_delta: 1.5
  irls_iterations: 12
  grid_rows: 3
  grid_cols: 3
  min_cell_points: 12
  min_valid_ratio: 0.35
  min_inlier_ratio: 0.7
  min_spatial_coverage: 0.55
  max_rmse_px: 1.0
pose:
  min_contour_area_px: 500
  min_contour_iou: 0.45
  max_fit_error_px: 6.0
  min_previous_normal_dot: 0.0
screw:
  offset_file: configs/screw_offset.yaml
debug:
  enabled: true
  save_inputs: false
  save_disp: false
  save_disp_vis: true
  save_depth: false
  save_point_cloud: false

safety:
  enabled: true
  action: error
  max_scale: 1.0
  max_valid_iters: 12
  max_max_disp: 128
  require_low_memory_when_vram_gb_lte: 6.5
  min_free_vram_gb: 1.0
  require_healthy_gpu: true

data_dir: workspace/data/A相机→白板268
out_dir: workspace/output/triangle_locator_offline
run_dir_format: "%m%d%H%M"
append_data_name_to_run_dir: true
overwrite: true
batch:
  pattern: "*.png"
  ids: ["000011"]
