# FoundationStereo 配置文件
#
# 推荐启动：
#   python scripts/run_config.py
#
# 显式指定配置：
#   python scripts/run_config.py --config configs/stereo_infer.yaml
#
# 只检查本地图片会跑哪些帧，不真正推理：
#   python scripts/run_config.py --dry_run


# 模型文件。这里需要使用 *_serialize.pth 这种可直接推理的序列化模型。
model_dir: weights/23-36-37/model_best_bp2_serialize.pth

# 相机内参文件。
# auto 表示自动读取 data_dir/K.txt。
# 注意：实时相机生成点云时也会用这个 K.txt，所以 camera 模式下 data_dir 仍要指向带 K.txt 的目录。
intrinsic_file: auto

# 模型迭代更新视差的次数。4 是当前推荐的速度/质量平衡档。
valid_iters: 2

# 最大视差搜索范围。物体越近、scale 越大，需要的 max_disp 往往越大。
# 128 比 96 覆盖更近目标，同时比 192/256 更快、更稳。
max_disp: 96

# FFS cost volume 构建后端。默认 pytorch1；如果仍在 Start forward 后整机重启，可改成 triton 排查。
build_volume_backend: pytorch1

# 省显存模式。1 更省显存但更慢；6GB 显卡建议保持 1，避免显存压力导致驱动/桌面崩溃。
low_memory: 1

# 推理前把左右图放大多少倍。ROI 模式下仍建议保持 1，稳定优先。
scale: 1

# 层级推理开关。0 是普通模式；1 会先低分辨率估计再细化。
hiera: 0

# 是否去掉右相机看不到的点。一般保持 1，可以减少遮挡边缘的错误点。
remove_invisible: 1


# =============================================================================
# 3. 共用参数：保存结果、点云、显示
# =============================================================================

# 结果保存开关。当前设置表示：只保存 YOLO mask 和两个裁剪点云。
save_inputs: 0
save_disp: 0
save_disp_vis: 0
save_depth: 1
save_report: 0

# 整张图点云输出开关。这里关闭 cloud.ply，只保留 segmentation 裁出来的两个点云。
get_pc: 1

# 点云和深度可视化的最远保留距离，单位 m。设小一点可以过滤远处无关背景。
zfar: 0.5

# YOLO-Seg + mask 裁剪点云。
# YOLO 只跑 left_rgb；mask 保存为 left_rgb 原图尺寸；裁点云时映射到 FFS 的 xyz_map。
segmentation:
  enabled: false
  model_path: weights/triangle-metal.pt
  imgsz: 960
  conf_thres: 0.35
  # 上次重启停在 yolo_seg 阶段，先让 YOLO 跑 CPU，避免它占 GPU。
  # 可选：cpu、0、cuda:0、auto。auto/空值表示使用 Ultralytics 默认设备。
  device: cpu

  # 先用 YOLO 找 ROI，再只对 ROI 跑 FFS，避免整张图双目推理导致 OOM/重启。
  crop_before_ffs: true
  crop_padding_px: 80
  crop_min_size_px: 160

  # 过滤过小 mask，避免误检污染点云。可按类别单独设置。
  min_area_px: 50
  min_area_by_class:
    target_plate: 500
    screwdriver_tip: 20

  # 小核开运算去噪点，小核闭运算补小洞；设为 0 可关闭。
  morph_open_kernel: 3
  morph_close_kernel: 3

  # 裁点云时的深度范围，单位 m。max_depth 留空表示不限制。
  min_depth: 0.0
  max_depth: 0.5

  # 点云输出。默认只输出 target_plate + screwdriver_tip 的合并点云。
  save_individual_object_clouds: false
  save_merged_object_cloud: true
  merged_object_cloud_file: target_tip_cloud.ply

  # debug_vis.png 可视化设置；内部始终保存 screwdriver_tip mask。
  debug_vis: true
  draw_masks: true
  draw_boxes: false
  draw_labels: false
  draw_tip_when_target_exists: true

# 点云半径滤波。0 表示不滤波；1 会额外保存 cloud_denoise.ply。
denoise_cloud: 0
denoise_nb_points: 30
denoise_radius: 0.03

# 无头环境建议保持 0。只有本机桌面有 DISPLAY 时再改成 1。
show: 0

# true 表示同名输出目录存在时先清空再写入。
overwrite: true


# =============================================================================
# 4. 安全限制：防止 6GB 显卡因参数过高导致驱动/整机重启
# =============================================================================

safety:
  enabled: true

  # clamp 表示超限时自动压回安全值；error 表示直接报错退出。
  action: clamp

  # RTX 3050 6GB 当前推荐平衡上限。
  max_scale: 1.0
  max_valid_iters: 4
  max_max_disp: 128

  # 显存小于等于这个值时，自动打开 low_memory。
  require_low_memory_when_vram_gb_lte: 6.5

  # 启动时如果空闲显存低于这个值，直接提示风险。
  min_free_vram_gb: 1.0

  # nvidia-smi 无法和驱动通信时直接停止，避免 torch/model.cuda() 把桌面或整机打崩。
  require_healthy_gpu: true


# =============================================================================
# 5. 本地图片流参数：input_mode: image 时使用
# =============================================================================

# 本地采集数据目录。脚本会自动识别：
#   data_dir/K.txt
#   data_dir/left_rgb/
#   data_dir/right_rgb/
data_dir: workspace/data/A相机→批头216

# 本地图片流的输出根目录。每次运行会在这里新建一个子目录。
out_dir: workspace/output/取料器真值

# 本地图片流的运行子目录时间格式。现在是“月日时分”，例如 06221430。
run_dir_format: "%m%d%H%M"

# true 会把数据目录名拼到输出目录后面。
# 如果同名目录已经存在，脚本会自动补 _02、_03，避免覆盖。
append_data_name_to_run_dir: true

batch:
  # 图片匹配规则。默认处理 png。
  pattern: "*.png"

  # 指定要跑的帧编号。如果要跑整个文件夹，改成 ids: []。
  ids: ["000011"]

  # 需要只跑一段时再打开下面这些限制。
  # start: "000100"
  # end: "000500"
  # limit: 20
