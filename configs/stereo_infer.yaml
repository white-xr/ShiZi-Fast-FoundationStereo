# 启动命令：
#   python scripts/run_config.py --config configs/stereo_infer.yaml
#
# 先检查会跑哪些图片，不真正推理：
#   python scripts/run_config.py --config configs/stereo_infer.yaml --dry_run

# 需要使用 *_serialize.pth 这种可直接推理的序列化模型。
model_dir: weights/15-44-51/model_best_bp2_serialize.pth

# 只需要改这里：填写一次采集输出目录。
# 脚本会自动使用：
#   data_dir/K.txt
#   data_dir/left_rgb/
#   data_dir/right_rgb/
data_dir: workspace/data/616-50mm/6
intrinsic_file: auto

# 数据和输出统一放在 workspace 下：
#   workspace/data    放输入数据
#   workspace/output  放推理输出
# 每次运行会自动创建子目录，例如 workspace/output/06151130_2/
# 默认会把 data_dir 最后一级目录名加到后面；如果同名目录已存在，会自动补 _02。
out_dir: workspace/output
run_dir_format: "%m%d%H%M"
append_data_name_to_run_dir: true

valid_iters: 24    #模型迭代更新视差的次数。越大通常越精细，但越慢。
max_disp: 256      #最大视差搜索范围。物体越近、scale 越大，需要的最大视差越大。
low_memory: 1      #省显存模式。1 更省显存但更慢，6GB 显卡建议打开。
scale: 1           #推理前把左右图放大多少倍
hiera: 0  #层级推理开关。0 是普通模式，保留细节更直接；1 是先低分辨率估计再细化，整体可能更稳，但小细节可能被平滑
remove_invisible: 1

# get_pc=1 会保存 cloud.ply 点云。
# 只要设置了 intrinsic_file，就会保存深度文件：
#   depth_meter.npy  浮点深度，单位 m
#   depth_mm.png     16 位深度原图，单位 mm
#   depth_vis.png    深度可视化图，方便无头环境查看
get_pc: 1
zfar: 3
denoise_cloud: 0
denoise_nb_points: 30
denoise_radius: 0.03

# 无头环境建议保持 0。只有本机桌面有 DISPLAY 时再改成 1。
show: 1
overwrite: true

# 可选：通过 SSH/SCP 把深度和点云传到 Windows。
transfer:
  enabled: false

  # 默认只传深度和点云相关文件；需要更多文件可以继续加。
  files:
    - depth_meter.npy
    - depth_mm.png
    - depth_vis.png
    - cloud.ply
    - cloud_denoise.ply
    - merged_cloud.ply

batch:
  pattern: "*.png"

  # 默认 ids: [] 跑整个文件夹。
  # 如果只想快速测试一张，可改成 ids: ["000411"]。
  ids: ["000015"]

  # 批量跑整个文件夹时，可以按编号范围或数量限制。
  # start: "000100"
  # end: "000500"
  # limit: 20

# 如果不想用 batch，也可以改成单张模式：
# single:
#   name: "000411"
#   left_file: workspace/data/data-50mm/真值500mm-双RGB-批头=下料机/left_rgb/000411.png
#   right_file: workspace/data/data-50mm/真值500mm-双RGB-批头=下料机/right_rgb/000411.png
